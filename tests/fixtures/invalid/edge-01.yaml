hostname: edge-01
users:
  - username: OpsLab
    role: netops
    secret_token: SYNTHETIC-OPS-LAB
    ssh_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEDGE0002 ops_lab@lab.example.invalid
  - username: audit_lab
    role: read-only
    secret_token: SYNTHETIC-AUDIT-LAB
    ssh_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEDGE0001 audit_lab@lab.example.invalid
interfaces:
  - name: Ethernet1
    description: uplink-to-dist-01
    enabled: true
    mode: trunk
    native_vlan: 10
    allowed_vlans: [10, 20, 30]
  - name: Ethernet2
    description: user-segment-a
    enabled: true
    mode: access
    access_vlan: 20
  - name: Ethernet3
    description: voice-segment-a
    enabled: true
    mode: access
    access_vlan: 30
vlans:
  - id: 10
    name: MGMT
  - id: 20
    name: USERS_A
  - id: 30
    name: VOICE
routing:
  router_id: 192.0.2.21
  static_routes:
    - prefix: 203.0.113.0/24
      next_hop: 192.0.2.1
      description: synthetic-default-exit
