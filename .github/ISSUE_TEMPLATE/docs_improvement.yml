name: Docs improvement
description: Suggest a documentation fix or improvement.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      description: Which doc page or README section needs work?
      placeholder: README.md or docs/runbook.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: true
